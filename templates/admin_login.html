{% extends "base.html" %}

{% block title %}Admin Login | PsyDetect{% endblock %}

{% block content %}

<section class="auth-section admin-auth">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-5">

                <div class="auth-card">

                    <div class="auth-icon admin-icon">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>

                    <h2>Administrator Login</h2>

                    <p>
                        Secure access to the PsyDetect administration panel.
                    </p>


                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Admin username"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Admin password"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-dark btn-lg w-100"
                        >
                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            Admin Login
                        </button>

                    </form>


                    <div class="admin-login-note">

                        <i class="bi bi-info-circle me-2"></i>

                        Default credentials:
                        <strong>admin / admin</strong>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
