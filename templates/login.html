{% extends "base.html" %}

{% block title %}Login | PsyDetect{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-5">

                <div class="auth-card">

                    <div class="auth-icon">
                        <i class="bi bi-person-circle"></i>
                    </div>

                    <h2>Welcome Back</h2>

                    <p>
                        Login to access your PsyDetect dashboard.
                    </p>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg w-100"
                        >
                            Login
                        </button>

                    </form>

                    <p class="auth-footer">

                        New user?

                        <a href="{{ url_for('register') }}">
                            Create an account
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
